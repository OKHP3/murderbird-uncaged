name: Validate build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-theme-release.mjs
      - run: node scripts/verify-publication.mjs
      - run: node scripts/verify-presentation.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/verify-media-import.py
