name: Technology freshness
on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh version inventory from official release sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run technology:report
      - name: Publish report in run summary
        if: always()
        run: cat docs/technology-versions.md >> "$GITHUB_STEP_SUMMARY"
