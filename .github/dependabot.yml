version: 2
updates:
  # Frozen at v1.0/v1.1 (see records/handoffs--project-closeout-2026-11-13.md).
  # Version-update PRs are paused; security alerts are unaffected. Restore 10 to resume.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      compatible-npm-updates:
        update-types:
          - minor
          - patch
      direct-major-updates:
        dependency-type: direct
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
