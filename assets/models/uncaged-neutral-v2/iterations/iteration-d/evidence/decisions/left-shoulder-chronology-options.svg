<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">V10 left shoulder chronology options</title>
  <desc id="desc">Two proposed chronologies preserve the same original twice-fitted anatomical-left plate and restricted travel. Option one assigns the restriction to the original plate and the later Mechanic brace to load support. Option two lets the later brace add a secondary travel stop. Neither diagram is measured geometry or accepted design.</desc>
  <defs>
    <style>
      .bg{fill:#10191c}.panel{fill:#19272c;stroke:#52666c;stroke-width:2}.stage{fill:#202f34;stroke:#52666c;stroke-width:1.5}.ink{fill:#e9ece5;font-family:Arial,sans-serif}.muted{fill:#aebbbc;font-family:Arial,sans-serif}.title{font-size:32px;font-weight:700;letter-spacing:.4px}.head{font-size:23px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.plate{fill:#aa7750;stroke:#e0b582;stroke-width:3}.brace{fill:none;stroke:#c7cbd0;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.brace2{fill:none;stroke:#e2b75b;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.joint{fill:#485d65;stroke:#d7e0df;stroke-width:3}.stop{fill:#d36c51;stroke:#f1b098;stroke-width:2}.actuator{fill:#70a0a3;stroke:#c6e3df;stroke-width:2}.line{stroke:#75898d;stroke-width:2}.arrow{fill:#75898d}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="arrow"/></marker>
  </defs>
  <rect width="1600" height="1040" class="bg"/>
  <text x="56" y="62" class="ink title">V10 · anatomical-left restriction and later repair</text>
  <text x="56" y="94" class="muted body">Chronology options for owner review · anatomical left stays asymmetric in every era · diagrams show relationships, not recovered topology</text>

  <g transform="translate(56 132)">
    <rect width="720" height="790" rx="18" class="panel"/>
    <text x="30" y="48" class="ink head">Option 1 · original plate limits travel</text>
    <text x="30" y="78" class="muted body">Recommended draft · the later brace carries load without creating the limit</text>
    <g transform="translate(24 112)">
      <rect width="210" height="388" rx="12" class="stage"/>
      <text x="18" y="34" class="ink head">Maker</text>
      <text x="18" y="61" class="muted small">original fitted state</text>
      <path d="M34 159h44v146H34z" fill="#65757a" stroke="#c1cccb" stroke-width="2"/>
      <circle cx="110" cy="228" r="33" class="joint"/>
      <path d="M104 203l47-46 42 34-44 49z" class="plate"/>
      <path d="M78 220l16-14" class="brace2"/>
      <path d="M137 264l14 14" class="stop"/>
      <path d="M142 227a57 57 0 0 1 21 19" fill="none" stroke="#db8e71" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="18" y="332" class="ink small">Twice-fitted bronze plate</text>
      <text x="18" y="353" class="muted small">and proposed short stop</text>
      <text x="18" y="374" class="muted small">(limit is a reconstruction)</text>

      <line x1="222" y1="194" x2="249" y2="194" class="line" marker-end="url(#arrow)"/>

      <rect x="258" width="210" height="388" rx="12" class="stage"/>
      <text x="276" y="34" class="ink head">Mechanic</text>
      <text x="276" y="61" class="muted small">later repair state</text>
      <path d="M292 159h44v146h-44z" fill="#65757a" stroke="#c1cccb" stroke-width="2"/>
      <circle cx="368" cy="228" r="33" class="joint"/>
      <path d="M362 203l47-46 42 34-44 49z" class="plate"/>
      <path d="M336 220l16-14" class="brace2"/>
      <path d="M354 206c26-59 76-62 106-18" class="brace"/>
      <circle cx="432" cy="188" r="15" class="joint"/>
      <path d="M397 270l14 14" class="stop"/>
      <text x="276" y="332" class="ink small">Iron strap / brass bearing</text>
      <text x="276" y="353" class="muted small">takes later load; clears</text>
      <text x="276" y="374" class="muted small">the original travel stop</text>

      <line x1="456" y1="194" x2="483" y2="194" class="line" marker-end="url(#arrow)"/>

      <rect x="492" width="180" height="388" rx="12" class="stage"/>
      <text x="510" y="34" class="ink head">Advanced</text>
      <text x="510" y="61" class="muted small">inherited state</text>
      <path d="M526 159h38v146h-38z" fill="#65757a" stroke="#c1cccb" stroke-width="2"/>
      <circle cx="590" cy="228" r="31" class="joint"/>
      <path d="M585 204l43-43 38 31-40 42z" class="plate"/>
      <path d="M564 220l15-14" class="brace2"/>
      <path d="M581 206c24-52 66-54 88-17" class="brace"/>
      <circle cx="646" cy="190" r="14" class="joint"/>
      <rect x="554" y="111" width="17" height="51" rx="8" class="actuator"/>
      <path d="M598 266l13 13" class="stop"/>
      <text x="510" y="332" class="ink small">Actuator respects</text>
      <text x="510" y="353" class="muted small">the original limit;</text>
      <text x="510" y="374" class="muted small">repair remains visible</text>
    </g>
    <rect x="24" y="522" width="672" height="220" rx="12" class="stage"/>
    <text x="46" y="559" class="ink body">Reading:</text>
    <text x="130" y="559" class="muted body">the asymmetry begins with the Maker’s twice-fitted plate.</text>
    <text x="46" y="597" class="muted body">The later iron/brass repair is a second layer. Its exact attachment is proposed.</text>
    <text x="46" y="635" class="muted body">The Advanced system learns the old limit and works within it.</text>
    <text x="46" y="692" class="ink small">Owner choice still required; story chronology favors this interpretation.</text>
  </g>

  <g transform="translate(824 132)">
    <rect width="720" height="790" rx="18" class="panel"/>
    <text x="30" y="48" class="ink head">Option 2 · later brace shares the limit</text>
    <text x="30" y="78" class="muted body">Alternative · the new repair may add a secondary stop</text>
    <g transform="translate(24 112)">
      <rect width="210" height="388" rx="12" class="stage"/>
      <text x="18" y="34" class="ink head">Maker</text>
      <text x="18" y="61" class="muted small">original fitted state</text>
      <path d="M34 159h44v146H34z" fill="#65757a" stroke="#c1cccb" stroke-width="2"/>
      <circle cx="110" cy="228" r="33" class="joint"/>
      <path d="M104 203l47-46 42 34-44 49z" class="plate"/>
      <path d="M78 220l16-14" class="brace2"/>
      <path d="M137 264l14 14" class="stop"/>
      <path d="M142 227a57 57 0 0 1 21 19" fill="none" stroke="#db8e71" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="18" y="332" class="ink small">Twice-fitted bronze plate</text>
      <text x="18" y="353" class="muted small">establishes asymmetry;</text>
      <text x="18" y="374" class="muted small">exact stop remains proposed</text>

      <line x1="222" y1="194" x2="249" y2="194" class="line" marker-end="url(#arrow)"/>

      <rect x="258" width="210" height="388" rx="12" class="stage"/>
      <text x="276" y="34" class="ink head">Mechanic</text>
      <text x="276" y="61" class="muted small">later repair state</text>
      <path d="M292 159h44v146h-44z" fill="#65757a" stroke="#c1cccb" stroke-width="2"/>
      <circle cx="368" cy="228" r="33" class="joint"/>
      <path d="M362 203l47-46 42 34-44 49z" class="plate"/>
      <path d="M336 220l16-14" class="brace2"/>
      <path d="M354 206c26-59 76-62 106-18" class="brace"/>
      <circle cx="432" cy="188" r="15" class="joint"/>
      <path d="M425 219l15 16 15-16" class="stop"/>
      <path d="M431 208l3 10" stroke="#f1b098" stroke-width="3"/>
      <text x="276" y="332" class="ink small">Repair brace adds</text>
      <text x="276" y="353" class="muted small">a secondary stop while</text>
      <text x="276" y="374" class="muted small">preserving the old plate</text>

      <line x1="456" y1="194" x2="483" y2="194" class="line" marker-end="url(#arrow)"/>

      <rect x="492" width="180" height="388" rx="12" class="stage"/>
      <text x="510" y="34" class="ink head">Advanced</text>
      <text x="510" y="61" class="muted small">inherited state</text>
      <path d="M526 159h38v146h-38z" fill="#65757a" stroke="#c1cccb" stroke-width="2"/>
      <circle cx="590" cy="228" r="31" class="joint"/>
      <path d="M585 204l43-43 38 31-40 42z" class="plate"/>
      <path d="M564 220l15-14" class="brace2"/>
      <path d="M581 206c24-52 66-54 88-17" class="brace"/>
      <circle cx="646" cy="190" r="14" class="joint"/>
      <rect x="554" y="111" width="17" height="51" rx="8" class="actuator"/>
      <path d="M608 264l13 15" class="stop"/>
      <text x="510" y="332" class="ink small">Actuator obeys</text>
      <text x="510" y="353" class="muted small">the combined original</text>
      <text x="510" y="374" class="muted small">and repair limit</text>
    </g>
    <rect x="24" y="522" width="672" height="220" rx="12" class="stage"/>
    <text x="46" y="559" class="ink body">Reading:</text>
    <text x="130" y="559" class="muted body">the original plate still explains the left/right difference.</text>
    <text x="46" y="597" class="muted body">The later repair may also constrain motion after the Mechanic refit.</text>
    <text x="46" y="635" class="muted body">This adds a mechanical role not stated directly in the story.</text>
    <text x="46" y="692" class="ink small">Owner choice still required; use only if the added stop reads clearly.</text>
  </g>

  <text x="56" y="978" class="muted small">SCHEMATIC ONLY · NOT TO SCALE · NO MEASURED JOINT, LOAD, MATERIAL THICKNESS, OR ATTACHMENT GEOMETRY · RIGHTS RESERVED</text>
</svg>
