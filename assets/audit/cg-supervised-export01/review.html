<!doctype html><html lang="en"><meta charset="utf-8"><title>Local export parity review</title><style>html,body{margin:0;background:#222;color:white;font:16px sans-serif}#view{height:90vh}canvas{display:block;width:100%;height:100%}button{margin:8px;padding:8px}</style><button id="neutral">Neutral</button><button id="exhibit">Exhibit</button><span id="status">Loading static GLB review…</span><div id="view"></div><script type="module">
