<text x="40" y="720" class="label">Landmark warning — reference relationship is qualitative</text>
<text x="40" y="750" class="small">Actual journal: 98.6mm behind / 110.2mm below optic. July visible round fitting: behind / only slightly below.</text>
<text x="40" y="778" class="small">Its identification as the same jaw pivot is inferred; perspective is not metrology. No pivot move is authored.</text>
<text x="40" y="815" class="small">Armor is asymmetric and directional. Receiving ribs are designed beneath these footprints, not an exterior annular disk.</text>
<text x="40" y="842" class="small">All colored shapes are proposals, not traced source edits, clearance certificates or owner approval.</text>
